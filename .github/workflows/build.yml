name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build
        run: |
          xcodebuild -project Beakon/Beakon.xcodeproj \
            -scheme Beakon \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Test
        run: |
          xcodebuild -project Beakon/Beakon.xcodeproj \
            -scheme Beakon \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:BeakonTests \
            test
