name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build Release
        run: |
          xcodebuild -project Beakon/Beakon.xcodeproj \
            -scheme Beakon \
            -configuration Release \
            -archivePath build/Beakon.xcarchive \
            archive

      - name: Create DMG
        run: |
          mkdir -p build/dmg
          cp -R build/Beakon.xcarchive/Products/Applications/Beakon.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Beakon" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            build/Beakon.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Beakon.dmg
          generate_release_notes: true
