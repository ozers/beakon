name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE_P12" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Release Archive
        run: |
          xcodebuild -project Beakon/Beakon.xcodeproj \
            -scheme Beakon \
            -configuration Release \
            -archivePath build/Beakon.xcarchive \
            -destination 'generic/platform=macOS' \
            archive \
            CODE_SIGN_IDENTITY="Developer ID Application: OZER SUBASI (QGVLTWHNKA)" \
            CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db"

      - name: Create DMG
        run: |
          mkdir -p build/dmg
          cp -R build/Beakon.xcarchive/Products/Applications/Beakon.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Beakon" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            build/Beakon.dmg
          codesign --force --sign "Developer ID Application: OZER SUBASI (QGVLTWHNKA)" \
            --keychain $RUNNER_TEMP/app-signing.keychain-db \
            build/Beakon.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: |
          xcrun notarytool submit build/Beakon.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARIZE_PASSWORD" \
            --wait
          xcrun stapler staple build/Beakon.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: build/Beakon.dmg
          generate_release_notes: true

      - name: Cleanup Keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
